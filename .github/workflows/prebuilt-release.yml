name: Build Prebuilt Standalone

on:
  push:
    branches:
      - to/main
    tags:
      - "v*"
      - "prebuilt-*"
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build prebuilt archive
        run: scripts/create-prebuilt.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9router-prebuilt
          path: dist/9router-prebuilt-*.tar.gz
          if-no-files-found: error

      - name: Publish branch prebuilt release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/to/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          short_sha="$(git rev-parse --short HEAD)"
          tag="prebuilt-${version}-${short_sha}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/9router-prebuilt-*.tar.gz --clobber
          else
            gh release create "$tag" dist/9router-prebuilt-*.tar.gz \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Prebuilt standalone 9router archive."
          fi

      - name: Publish tag release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/9router-prebuilt-*.tar.gz --clobber
          else
            gh release create "$tag" dist/9router-prebuilt-*.tar.gz \
              --title "$tag" \
              --notes "Prebuilt standalone 9router archive."
          fi

      - name: Upload manual release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/9router-prebuilt-*.tar.gz --clobber
